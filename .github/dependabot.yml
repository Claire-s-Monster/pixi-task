---
# Dependabot configuration for pixi-task
# Monitors GitHub Actions for security/version updates
version: 2

updates:
  # GitHub Actions dependency monitoring
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      ci-framework:
        patterns:
          - "Claire-s-Monster/ci-framework"

  # pip/PyPI dependency monitoring (pyproject.toml [project.optional-dependencies])
  # pixi manages conda deps; dependabot covers PyPI fallback if any are added
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
