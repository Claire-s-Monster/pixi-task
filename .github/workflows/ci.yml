---
# CI pipeline using ci-framework reusable workflow
name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@e8fd6c455a9a68dc689a84b59630f071816f0c39  # v4.2.1
    with:
      pixi-environment: "ci"
      python-versions: '["3.12"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-postgres: false
      editable-install: false
    secrets: inherit

  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check CI status
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          if [[ "$CI_RESULT" == "success" ]]; then
            echo "CI passed"
          else
            echo "CI failed with result: $CI_RESULT"
            exit 1
          fi
