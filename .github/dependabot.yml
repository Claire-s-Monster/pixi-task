---
# Dependabot configuration for pixi-task
# Monitors GitHub Actions for security/version updates
version: 2

# pixi/conda dependencies are not supported by Dependabot (it ignores [tool.pixi.*] and pixi.lock); they need a separate pixi update workflow.
updates:
  # GitHub Actions dependency monitoring
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      ci-framework:
        patterns:
          - "Claire-s-Monster/ci-framework"
